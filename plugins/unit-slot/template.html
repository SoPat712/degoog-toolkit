<div class="uxs-wrap" data-measure="{{measure}}" data-collapsed="false">
  <div class="uxs-main">
    <div class="uxs-top-bar uxs-pane sidebar-panel degoog-panel degoog-panel--accordion">
      <button type="button" class="degoog-accordion-toggle uxs-toggle" aria-expanded="true" aria-controls="uxs-body" aria-label="{{ t:plugin-unit-slot.collapseConverter }}" title="{{ t:plugin-unit-slot.collapseConverter }}">
        <span class="uxs-summary" aria-live="polite" aria-hidden="true">{{amount}} {{from_code}} = {{result}} {{to_code}}</span>
        <svg class="accordion-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="degoog-select-wrap uxs-category-wrap">
        <span class="uxs-category-size" aria-hidden="true">{{measure}}</span>
        <select class="degoog-input uxs-category-select" id="uxs-category-select" aria-label="{{ t:plugin-unit-slot.category }}"></select>
        <svg class="accordion-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>

    <div class="uxs-body uxs-pane sidebar-panel degoog-panel degoog-panel--accordion" id="uxs-body">
    <div class="uxs-row" id="uxs-from-row">
      <div class="uxs-input-wrap uxs-input-wrap--editable">
        <div class="uxs-label">{{ t:plugin-unit-slot.amount }}</div>
        <input class="degoog-input uxs-amount" id="uxs-amount" type="number" value="{{amount_for_js}}" step="any" aria-label="{{ t:plugin-unit-slot.amount }}"/>
      </div>
      <div class="degoog-select-wrap uxs-select-wrap">
        <select class="degoog-input uxs-unit-select" id="uxs-from-select" data-selected="{{from_code}}" aria-label="{{ t:plugin-unit-slot.fromUnit }}"></select>
      </div>
    </div>

    <div class="uxs-divider">
      <button type="button" class="uxs-swap" id="uxs-swap" aria-label="{{ t:plugin-unit-slot.swapUnits }}">
        <span class="uxs-swap-inner">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 4.5h9M8 2l3 2.5L8 7M11 8.5H2M5 6l-3 2.5L5 11"/>
          </svg>
        </span>
      </button>
    </div>

    <div class="uxs-row">
      <div class="uxs-input-wrap uxs-input-wrap--result">
        <div class="uxs-label">{{ t:plugin-unit-slot.result }}</div>
        <div class="uxs-result-line">
          <output class="uxs-result" id="uxs-result" aria-live="polite" aria-atomic="true">{{result}}</output>
          <button class="uxs-copy" id="uxs-copy-result" type="button" aria-label="{{ t:plugin-unit-slot.copyResult }}" title="{{ t:plugin-unit-slot.copyResult }}">
            <svg class="uxs-copy-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <svg class="uxs-copy-done" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"></path>
            </svg>
          </button>
        </div>
      </div>
      <div class="degoog-select-wrap uxs-select-wrap">
        <select class="degoog-input uxs-unit-select" id="uxs-to-select" data-selected="{{to_code}}" aria-label="{{ t:plugin-unit-slot.toUnit }}"></select>
      </div>
    </div>

    <div class="uxs-formula-bar" id="uxs-formula">
      {{amount}} {{from_name}} = {{result}} {{to_name}}
    </div>
    <div class="uxs-quick" role="group" aria-label="{{ t:plugin-unit-slot.quickConversions }}"></div>
    <p class="uxs-storage-hint" hidden>{{ t:plugin-unit-slot.storageHint }}</p>
    </div>
  </div>
</div>
