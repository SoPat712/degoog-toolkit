<form action="/search" method="get" id="search-form-home" class="search-form">
    <div class="search-bar degoog-search-bar" id="search-bar-home">
        <svg
            class="search-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--search-bar-icon)"
            stroke-width="3"
            aria-hidden="true"
        >
            <circle cx="11" cy="11" r="8" />
            <path d="M21 21l-4.35-4.35" />
        </svg>
        <input
            type="text"
            class="search-input"
            id="search-input"
            name="q"
            autocomplete="off"
            aria-label="{{t:index-templates.search.search-button}}"
            placeholder="{{t:index-templates.search.search-button}}"
        />
        <button
            class="lg-search-clear-btn"
            id="home-search-clear-btn"
            type="reset"
            aria-label="{{ t:theme-literallygoogle.clearSearch }}"
            title="{{ t:theme-literallygoogle.clearSearch }}"
        >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
            </svg>
        </button>
        <div class="ac-dropdown" id="ac-dropdown-home"></div>
        <div id="search-bar-actions-home" class="search-bar-actions"></div>
    </div>
    <div class="button-row">
        <button type="submit" class="search-btn" id="btn-search">
            {{t:index-templates.search.search-button}}
        </button>
        <button type="button" class="search-btn lucky-btn" id="btn-lucky">
            <span class="lucky-default">{{t:index-templates.search.feeling-lucky}}</span>
            <div class="lucky-slot">
                <div class="lucky-slot-inner" id="lucky-slot-inner">
                    <span>{{t:index-templates.search.feeling-lucky}}</span>
                    <span class="lucky-alt">{{t:index-templates.search.feeling-curious}}</span>
                    <span class="lucky-alt lucky-long">{{t:index-templates.search.feeling-adventurous}}</span>
                    <span class="lucky-alt">{{t:index-templates.search.feeling-playful}}</span>
                    <span class="lucky-alt">{{t:index-templates.search.feeling-stellar}}</span>
                    <span class="lucky-alt">{{t:index-templates.search.feeling-trendy}}</span>
                </div>
            </div>
        </button>
    </div>
</form>
