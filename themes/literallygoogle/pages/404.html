<script>
  (function () {
    var robot = document.getElementById("lg-error-robot");
    var page = robot && robot.closest(".lg-error-page");
    var url = document.getElementById("lg-error-url");
    var msg = document.getElementById("lg-error-dance");
    var base = window.__DEGOOG_BASE_URL__ || "";
    if (url) url.textContent = window.location.pathname.slice(base.length) || "/";
    if (!robot || !page || !msg) return;
    var clicks = 0;
    var dancing = false;
    robot.addEventListener("animationend", function () {
      robot.classList.remove("lg-error-art--wobble");
    });
    robot.addEventListener("click", function () {
      if (dancing) return;
      clicks += 1;
      if (clicks < 5) {
        robot.classList.remove("lg-error-art--wobble");
        void robot.offsetWidth;
        robot.classList.add("lg-error-art--wobble");
        return;
      }
      dancing = true;
      robot.classList.add("lg-error-art--dancing");
      var link = document.createElement("a");
      link.href = base + "/robots-takeover";
      link.textContent = page.getAttribute("data-lg-dance") || "";
      msg.replaceChildren(link);
      setTimeout(function () {
        robot.classList.remove("lg-error-art--dancing");
        msg.replaceChildren();
        dancing = false;
        clicks = 0;
      }, 3000);
    });
  })();
</script>
