<div id="app">
  <main class="lg-error-page" data-lg-dance="{{ t:theme-literallygoogle.notFoundDance }}">
    <div class="lg-error-copy">
      <a href="/" class="lg-error-logo" aria-label="{{ t:theme-literallygoogle.home }}">
        <span class="logo-d logo-letter">d</span><span class="logo-e logo-letter">e</span
        ><span class="logo-g1 logo-letter">g</span><span class="logo-o1 logo-letter">o</span
        ><span class="logo-o2 logo-letter">o</span><span class="logo-g2 logo-letter">g</span>
      </a>
      <p class="lg-error-headline">
        <b>404.</b> <span class="lg-error-muted">{{ t:theme-literallygoogle.notFoundHeadline }}</span>
      </p>
      <p class="lg-error-body">{{ t:theme-literallygoogle.notFoundBody }}</p>
      <p class="lg-error-url" id="lg-error-url"></p>
      <p class="lg-error-body lg-error-muted">{{ t:theme-literallygoogle.notFoundHint }}</p>
      <p class="lg-error-dance" id="lg-error-dance" aria-live="polite"></p>
    </div>
    <button
      type="button"
      class="lg-error-art"
      id="lg-error-robot"
      aria-label="{{ t:theme-literallygoogle.notFoundRobot }}"
    >
      <svg viewBox="0 0 240 240" width="240" height="240" aria-hidden="true" focusable="false">
        <ellipse class="lg-art-shadow" cx="116" cy="222" rx="92" ry="9" />
        <g class="lg-art-spark">
          <path d="M196 170l8-14M206 182l14-6M190 160l-2-14" />
        </g>
        <g class="lg-art-arm-loose" transform="rotate(-18 188 204)">
          <rect class="lg-art-part" x="160" y="196" width="52" height="16" rx="8" />
          <circle class="lg-art-joint" cx="166" cy="204" r="5" />
        </g>
        <rect class="lg-art-part" x="80" y="168" width="20" height="48" rx="8" />
        <rect class="lg-art-part" x="122" y="168" width="20" height="48" rx="8" />
        <rect class="lg-art-part" x="44" y="112" width="18" height="52" rx="9" transform="rotate(14 53 112)" />
        <rect class="lg-art-part" x="60" y="100" width="102" height="78" rx="20" />
        <rect class="lg-art-panel" x="84" y="118" width="54" height="30" rx="9" />
        <circle class="lg-art-light lg-art-blue" cx="98" cy="133" r="5" />
        <circle class="lg-art-light lg-art-red" cx="111" cy="133" r="5" />
        <circle class="lg-art-light lg-art-yellow" cx="124" cy="133" r="5" />
        <rect class="lg-art-part" x="100" y="86" width="22" height="16" rx="4" />
        <g class="lg-art-head">
          <path class="lg-art-antenna" d="M111 30v-10l9-9" />
          <circle class="lg-art-light lg-art-green" cx="122" cy="9" r="6" />
          <rect class="lg-art-part" x="56" y="28" width="110" height="62" rx="24" />
          <circle class="lg-art-eye" cx="90" cy="58" r="9" />
          <path class="lg-art-x" d="M126 50l14 14M140 50l-14 14" />
          <path class="lg-art-mouth" d="M94 76c6-5 12 5 18 0s12 5 18 0" />
        </g>
      </svg>
    </button>
  </main>
</div>
<script>
  (function () {
    var robot = document.getElementById("lg-error-robot");
    var page = robot && robot.closest(".lg-error-page");
    var url = document.getElementById("lg-error-url");
    var msg = document.getElementById("lg-error-dance");
    var base = window.__DEGOOG_BASE_URL__ || "";
    if (url) url.textContent = window.location.pathname.slice(base.length) || "/";
    if (!robot || !page || !msg) return;
    var clicks = 0;
    var dancing = false;
    robot.addEventListener("animationend", function () {
      robot.classList.remove("lg-error-art--wobble");
    });
    robot.addEventListener("click", function () {
      if (dancing) return;
      clicks += 1;
      if (clicks < 5) {
        robot.classList.remove("lg-error-art--wobble");
        void robot.offsetWidth;
        robot.classList.add("lg-error-art--wobble");
        return;
      }
      dancing = true;
      robot.classList.add("lg-error-art--dancing");
      var link = document.createElement("a");
      link.href = base + "/robots-takeover";
      link.textContent = page.getAttribute("data-lg-dance") || "";
      msg.replaceChildren(link);
      setTimeout(function () {
        robot.classList.remove("lg-error-art--dancing");
        msg.replaceChildren();
        dancing = false;
        clicks = 0;
      }, 3000);
    });
  })();
</script>
