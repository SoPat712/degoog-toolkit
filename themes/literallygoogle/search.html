>
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var type = params.get("type") || params.get("categories") || "web";
            // Exact types, as core and the runtime sync use; a substring test
            // would read "commits" or "unit" as IT.
            if (type.startsWith("tab:engine:")) type = type.slice(11);
            else if (type.startsWith("engine:")) type = type.slice(7);
            else if (type.startsWith("tab:")) type = type.slice(4);
            if (!type) type = "web";
            document.getElementById("results-page").setAttribute("data-lg-search-type", type);
        })();
    </script>
    <div id="results-header"></div>
    <div id="results-tabs"></div>
    <div id="results-meta"></div>
    <div id="slot-full-width-above-results"></div>
    <div id="results-layout">
        <div id="results-main">
            <div id="at-a-glance"></div>
            <div id="slot-above-results"></div>
            <div id="results-list"></div>
            <div id="pagination"></div>
            <div id="slot-below-results"></div>
        </div>
        <div id="sidebar-col">
            <div class="sticky">
                <div id="slot-above-sidebar"></div>
                <div id="results-sidebar"></div>
                <div id="slot-below-sidebar"></div>
            </div>
        </div>
        <div id="image-filters-bar"></div>
        <div id="media-preview-panel"></div>
    </div>
